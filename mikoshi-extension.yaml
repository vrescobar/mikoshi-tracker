# Manifiesto de extensión de la plataforma Mikoshi (contrato:
# ~/projects/mikoshi-stack/docs/contract-summary.md). Lo consume
# `ext-install` (mikoshi); el schema estricto vive en
# mikoshi/src/extensions/manifest.ts — un campo desconocido rompe la
# instalación, no se ignora.
#
# La admin key registrada en mikoshi para este slug es la
# MIKOSHI_TRACKER_ADMIN_API_KEY ya existente (se conserva durante la
# migración R1 — no rotar). `skills: []` a propósito: las 3 skills
# `mikoshi-tracker*` viven hoy en el repo de mikoshi y se migran (o se
# retiran sus prefijos del interceptor legacy) en la story 54.
slug: tracker
name: Mikoshi Tracker
upstream: http://127.0.0.1:7080
healthcheck: /health
skills: []
endpoints:
  provision: /api/platform/provision
  issueMagicLink: /api/platform/issue-magic-link
  identityEvents: /hooks/identity
capabilities:
  groupAccess: true
  cronWebhooks: false
  identityEvents: true
consent: dm-approval
secrets:
  admin: MIKOSHI_TRACKER_ADMIN_API_KEY
  personalToken: MIKOSHI_TRACKER_PERSONAL_TOKEN
